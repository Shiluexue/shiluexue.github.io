<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preload" href="../fonts/AirbnbCereal_W_Bk.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="../fonts/AirbnbCereal_W_Bd.otf" as="font" type="font/otf" crossorigin>
  <title>Playgrounds | Shilue's Portfolio</title>
  <meta name="description" content="Design experiments and side projects by Shilue Xue." />
  <link rel="icon" type="image/png" href="../images/avatar-header.png" />
  <style>
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 300; font-style: normal; src: url('../fonts/AirbnbCereal_W_Lt.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 400; font-style: normal; src: url('../fonts/AirbnbCereal_W_Bk.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 500; font-style: normal; src: url('../fonts/AirbnbCereal_W_Md.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 700; font-style: normal; src: url('../fonts/AirbnbCereal_W_Bd.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 800; font-style: normal; src: url('../fonts/AirbnbCereal_W_XBd.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Airbnb Cereal App'; font-weight: 900; font-style: normal; src: url('../fonts/AirbnbCereal_W_Blk.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Cereal-fallback'; src: local('Arial'); size-adjust: 102%; ascent-override: 92%; descent-override: 22%; line-gap-override: 0%; }

:root {
  --color-text: #1C3142;
  --color-text-deep: #0E1821;
  --color-text-muted: #4A5868;
  --color-bg: #FFFFFF;
  --color-divider: #E5E7EB;
  --color-accent: #C24A3A;
  --bg-text-default: #F9F9FA;
  --font-sans: "Airbnb Cereal App", "Cereal-fallback", "Inter", "Helvetica Neue", Arial, Helvetica, sans-serif;
  --container-width: 1022px;
  --header-height: 80px;
}
* { box-sizing: border-box; }
html {
  /* Force vertical scrollbar to always show — guarantees identical viewport
     width across all pages so the centered header never shifts. */
  overflow-y: scroll;
  scroll-behavior: smooth;
}
html, body {
  margin: 0; padding: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:hover { opacity: 0.85; transition: opacity .2s ease; }
.brand:hover { opacity: 1; }
img { max-width: 100%; display: block; }
.container { max-width: var(--container-width); margin: 0 auto; }

/* Header — transparent default, glass when scrolled */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  width: 100%;
  background: transparent;
  z-index: 100;
  height: var(--header-height);
  display: flex; align-items: center;
  border-bottom: 1px solid transparent;
  transition: background-color .35s cubic-bezier(.4,0,.2,1),
              backdrop-filter .35s cubic-bezier(.4,0,.2,1),
              -webkit-backdrop-filter .35s cubic-bezier(.4,0,.2,1),
              border-color .35s cubic-bezier(.4,0,.2,1),
              box-shadow .35s cubic-bezier(.4,0,.2,1);
}
body { padding-top: var(--header-height); }
.site-header.is-scrolled {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: saturate(160%) blur(28px);
  -webkit-backdrop-filter: saturate(160%) blur(28px);
  border-bottom-color: rgba(15, 24, 33, 0.08);
  box-shadow: 0 4px 24px -10px rgba(15, 24, 33, 0.10);
}
.site-header__inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--color-text); }
.brand:hover { opacity: 1; }
.brand-avatar { position: relative; width: 38px; height: 40px; flex-shrink: 0; }
.brand-avatar img { position: absolute; top: 0; left: 0; width: 38px; height: 40px; object-fit: cover; border-radius: 50%; transition: opacity .2s ease, transform .4s cubic-bezier(.4,0,.2,1); }
.brand-avatar__hover { opacity: 0; }
.brand:hover .brand-avatar__default { opacity: 0; }
.brand:hover .brand-avatar__hover { opacity: 1; }
.brand:hover .brand-avatar img { transform: scale(1.05); }

.nav { display: flex; gap: 60px; align-items: center; }
.nav a {
  position: relative;
  display: inline-block;
  padding: 6px 0;
  font-size: 16px; font-weight: 500;
  color: var(--color-text);
  transition: color .25s cubic-bezier(.4,0,.2,1);
}
.nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 2px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .35s cubic-bezier(.65,0,.35,1);
}
.nav a:hover::after,
.nav a.is-active::after { transform: scaleX(1); }
.nav a:hover { color: var(--color-text); opacity: 1; }
.nav a.is-active { color: #0A66C2; }

/* Footer */
.site-footer { padding: 60px 24px; text-align: center; font-size: 15px; color: var(--color-text-muted); }

/* Page content */
.page-intro {
  max-width: var(--container-width);
  margin: 0 auto;
  padding: 96px 0 56px;
}
.page-intro h1 {
  font-size: 40px;
  font-weight: 700;
  color: var(--color-text);
  margin: 0 0 16px;
  letter-spacing: -0.005em;
}
.page-intro p {
  font-size: 21px;
  color: var(--color-text-muted);
  margin: 0;
  max-width: 640px;
}
.empty-state {
  max-width: var(--container-width);
  margin: 0 auto;
  padding: 64px 0 200px;
  text-align: center;
  color: var(--color-text-muted);
  font-size: 16px;
}

/* Responsive */
:root { --side-pad: 0px; }
.container, .page-intro, .empty-state { padding-left: var(--side-pad); padding-right: var(--side-pad); }
.site-header > .container { padding-left: var(--side-pad); padding-right: var(--side-pad); }

@media (max-width: 1080px) {
  :root { --container-width: 100%; --side-pad: 16px; }
  .nav { gap: 48px; }
}
@media (max-width: 900px) {
  :root { --side-pad: 16px; }
  .nav { gap: 32px; }
  .page-intro h1 { font-size: 36px; }
}
@media (max-width: 768px) {
  :root { --side-pad: 24px; }
  .site-header { height: 68px; }
  .brand { font-size: 16px; gap: 10px; white-space: nowrap; }
  .brand-avatar, .brand-avatar img { width: 34px; height: 36px; }
  .nav { gap: 24px; }
  .nav a { font-size: 15px; }
  .page-intro { padding: 64px 0 40px; }
  .page-intro h1 { font-size: 32px; }
  .page-intro p { font-size: 18px; }
}
@media (max-width: 600px) {
  :root { --side-pad: 20px; }
  .site-header { height: 60px; }
  .brand span { font-size: 15px; }
  .brand-avatar, .brand-avatar img { width: 30px; height: 32px; }
  .nav { gap: 18px; }
  .nav a { font-size: 14px; }
  .page-intro h1 { font-size: 28px; }
  .page-intro p { font-size: 16px; }
}
@media (max-width: 380px) {
  :root { --side-pad: 16px; }
  .nav { gap: 14px; }
  .nav a { font-size: 13px; }
  .brand span { font-size: 14px; }
}
  
/* ============ Header unified — fixed max-width across all pages (kills nav jitter) ============ */
.site-header__inner{max-width:1200px !important;margin:0 auto !important;padding:0 24px !important;width:100% !important;box-sizing:border-box}


/* ============ Nav unified — same size/spacing across all pages & breakpoints (kills switch-jitter) ============ */
.nav{display:flex !important;gap:48px !important;align-items:center !important}
.nav a{font-size:16px !important;font-weight:500 !important;padding:6px 0 !important}
@media (max-width:900px){.nav{gap:32px !important}}
@media (max-width:600px){.nav{gap:20px !important}}




/* ============ Cross-page View Transitions (Chrome/Edge 126+, Safari 18+) ============ */
@view-transition { navigation: auto; }
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s;animation-timing-function:cubic-bezier(.4,0,.2,1);mix-blend-mode:normal}
::view-transition-old(root){animation-name:vt-fade-out}
::view-transition-new(root){animation-name:vt-fade-in}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}


.wow-progress{position:fixed;top:0;left:0;height:2px;background:#F5A623;width:0%;z-index:9999;transition:width .1s ease-out}


/* Site-wide signature stamp (in footer) */
.wow-sig{font-family:var(--font-sans);font-size:13px;font-weight:700;color:var(--color-text-muted,#4A5868);letter-spacing:0.28em;text-transform:uppercase;margin:0;opacity:0.65;text-align:center}

.site-header{view-transition-name:site-header}
::view-transition-group(site-header){animation-duration:.01s}
::view-transition-old(site-header),::view-transition-new(site-header){animation:none}
</style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="../index.html" class="brand" aria-label="Shilue's Portfolio">
        <span class="brand-avatar"><img class="brand-avatar__default" src="../images/avatar-header.png" alt="Shilue avatar icon" /><img class="brand-avatar__hover" src="../images/avatar-header-hover.png" alt="" /></span>
        <span>Shilue's Portfolio</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="../index.html">Projects</a>
        <a href="../resume.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-intro">
      <h1>Playgrounds</h1>
      <p>Design experiments, side projects, and explorations.</p>
    </section>

    <section class="empty-state">
      <p>Content coming soon.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="wow-sig">SHILUE &nbsp;·&nbsp; 2026</p>
  </footer>

  <script>
    (function () {
      const header = document.querySelector('.site-header');
      if (!header) return;
      let scrolled = false;
      const onScroll = () => {
        const isScrolled = window.scrollY > 16;
        if (isScrolled !== scrolled) {
          scrolled = isScrolled;
          header.classList.toggle('is-scrolled', scrolled);
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>

<script>
  // Prefetch same-origin html links on hover — near-instant navigation
  (function(){
    var prefetched = new Set();
    document.addEventListener('mouseover', function(e){
      var link = e.target.closest && e.target.closest('a[href]');
      if (!link) return;
      var href = link.href;
      if (!href || prefetched.has(href)) return;
      // Only same-origin html
      try { var u = new URL(href, location.href); if (u.origin !== location.origin) return; } catch(e){ return; }
      if (!/\.html($|\?|#)/.test(u.pathname) && u.pathname !== '/' && !u.pathname.endsWith('/')) return;
      var l = document.createElement('link');
      l.rel = 'prefetch'; l.href = href; l.as = 'document';
      document.head.appendChild(l);
      prefetched.add(href);
    }, { passive: true });
  })();
</script>

<script>
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var b = document.createElement('div');
  b.className = 'wow-progress';
  document.body.appendChild(b);
  function u(){ var h = document.documentElement.scrollHeight - window.innerHeight; b.style.width = (h>0 ? Math.min(100,window.scrollY/h*100) : 0) + '%'; }
  window.addEventListener('scroll', u, { passive: true });
  u();
})();
</script>

</body>
</html>
